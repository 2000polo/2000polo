name: Update GitHub Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate contribution graph
        uses: pipipi-dev/gcchart@v1
        with:
          github_user_name: 2000polo
          github_token: ${{ github.token }}
          outputs: |
            contributions.svg?theme=dark&style=clean&cumulative=false

